services:
  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    container_name: dsa_ae3_nodered
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.75
    ports:
      - "${NODERED_PORT:-1880}:1880"
      - "${GEMELO_PORT:-5020}:5020"
      - "${ESP32A_SIM_PORT:-5021}:5021"
      - "${ESP32B_SIM_PORT:-5022}:5022"
    environment:
      - TZ=America/Bogota
      - NODE_RED_ENABLE_PROJECTS=false
      - NODE_OPTIONS=--max-old-space-size=192
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - ./nodered/data:/data

  gemelo:
    build:
      context: ./gemelo
      dockerfile: Dockerfile
    container_name: dsa_ae3_gemelo
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.50
    # Comparte la red con nodered: 127.0.0.1:5020 (Gemelo), 5021 (ESP32 A) y 5022 (ESP32 B)
    network_mode: "service:nodered"
    depends_on:
      - nodered
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    command: >
      sh -c "python -u simulador_esp32.py --puerto-a 5021 --puerto-b 5022 &
      exec python -u planta_gemela.py --planta ${PLANTA:-1} --puerto 5020 --dt 0.25 --vel ${VELOCIDAD:-1.0}"
